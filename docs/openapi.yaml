openapi: 3.0.3
info:
  title: PMC Tracker Backend API
  description: Authentication, OTP Management, and User Administration REST API
  version: 1.0.0
servers:
  - url: http://localhost:5000/auth/api
    description: Local Development Server (/auth/api format)
  - url: http://localhost:5000/api/v1
    description: Local Development Server (/api/v1 format)

paths:
  /auth/login:
    post:
      summary: Log In
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - password
              properties:
                phone:
                  type: string
                  example: "1234567891"
                password:
                  type: string
                  example: "Rahul@1212"
                captchaToken:
                  type: string
                  nullable: true
                  example: null
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              example:
                success: true
                message: "User logged in successfully"
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                expires_in: 86400

  /users:
    post:
      summary: Create User
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - phone
                - email
                - role
                - designation
              properties:
                first_name:
                  type: string
                  example: "Rahul"
                last_name:
                  type: string
                  example: "Wale"
                phone:
                  type: string
                  example: "9356853041"
                email:
                  type: string
                  example: "rahul@gmail.com"
                role:
                  type: string
                  example: "Software Developer"
                designation:
                  type: string
                  example: "Software Developer"
      responses:
        '201':
          description: User created successfully

  /auth/request-otp:
    post:
      summary: Request OTP
      tags:
        - Password Reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  example: "9356853041"
      responses:
        '200':
          description: Password reset OTP sent successfully
          content:
            application/json:
              example:
                success: true
                message: "Password reset OTP sent successfully"
                phone: "9356853041"
                otpPhone: "9356853041"

  /auth/verify-otp:
    post:
      summary: Verify OTP
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - otp
              properties:
                phone:
                  type: string
                  example: "9356853041"
                otp:
                  type: string
                  example: "417620"
                captchaToken:
                  type: string
                  nullable: true
                  example: null
      responses:
        '200':
          description: OTP verified and login successful
          content:
            application/json:
              example:
                success: true
                message: "User logged in successfully"
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                expires_in: 86400

  /auth/verify-password-reset-otp:
    post:
      summary: Verify Password Reset OTP
      tags:
        - Password Reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - otp
              properties:
                phone:
                  type: string
                  example: "9356853041"
                otp:
                  type: string
                  example: "417620"
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              example:
                success: true
                message: "OTP verified successfully"
                reset_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

  /auth/reset-password:
    post:
      summary: Reset Password
      tags:
        - Password Reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_password
                - confirm_password
                - token
              properties:
                new_password:
                  type: string
                  example: "Rahul@123"
                confirm_password:
                  type: string
                  example: "Rahul@123"
                token:
                  type: string
                  example: "YOUR_RESET_TOKEN"
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              example:
                success: true
                message: "Password reset successfully"

  /auth/me:
    get:
      summary: Get Current User Profile
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
        '401':
          description: Unauthorized - No bearer token provided

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
