openapi: 3.0.3
info:
  title: PMC Tracker Backend API
  description: Workforce attendance, GPS tracking, and task management REST API
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  example: john.doe@example.com
                password:
                  type: string
                  example: secret123
                role:
                  type: string
                  enum: [Employee, Supervisor, Admin]
                  example: Employee
                phone:
                  type: string
                  example: "+1234567890"
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Email already registered
        '422':
          description: Validation error

  /auth/login:
    post:
      summary: Authenticate user and return access & refresh tokens
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: john.doe@example.com
                password:
                  type: string
                  example: secret123
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid email or password

  /auth/refresh:
    post:
      summary: Obtain a new access token using a refresh token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
        '401':
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      summary: Invalidate refresh token and logout
      tags:
        - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Logout successful

  /auth/forgot-password:
    post:
      summary: Request password reset link / token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: john.doe@example.com
      responses:
        '200':
          description: Password reset token generated

  /auth/reset-password:
    post:
      summary: Reset password with token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resetToken
                - newPassword
              properties:
                resetToken:
                  type: string
                newPassword:
                  type: string
                  example: newSecret123
      responses:
        '200':
          description: Password reset successfully

  /auth/me:
    get:
      summary: Get current authenticated user profile
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user profile retrieved
        '401':
          description: Unauthorized

  /devices/register:
    post:
      summary: Register FCM token for push notifications
      tags:
        - Devices
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fcm_token
              properties:
                fcm_token:
                  type: string
                  example: fcm_token_sample_abc123
                platform:
                  type: string
                  enum: [android, ios, web]
                  example: android
      responses:
        '201':
          description: Device FCM token registered successfully

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
